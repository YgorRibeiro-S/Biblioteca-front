<div class="container mt-4">

  <h2 class="fw-bold text-success mb-4">
    Livros Ativos
  </h2>

  <div
    class="card border-0 shadow-sm mb-3"
    *ngFor="let livro of livrosAtivos">

    <div class="card-body d-flex justify-content-between align-items-center">

      <span>{{ livro.nome }}</span>

      <button
        class="btn btn-danger btn-sm"
        (click)="inativarLivro(livro.id)">

        Inativar

      </button>

    </div>

  </div>

  <h2 class="fw-bold text-success mb-4 mt-5">
    Livros Inativos
  </h2>

  <div
    class="card border-0 shadow-sm mb-3"
    *ngFor="let livro of livrosInativos">

    <div class="card-body d-flex justify-content-between align-items-center">

      <span>{{ livro.nome }}</span>

      <button
        class="btn btn-success btn-sm"
        (click)="ativarLivro(livro.id)">

        Ativar

      </button>

    </div>

  </div>

</div>
