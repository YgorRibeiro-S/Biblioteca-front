<div class="container mt-4">

  <h2 class="fw-bold text-success mb-4">
    Editar Usuário
  </h2>

  <div class="card border-0 shadow-sm p-4">

    <form (ngSubmit)="atualizar()">

      <div class="mb-3">

        <label>Nome</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="usuario.nome"
          name="nome">

      </div>

      <div class="mb-3">

        <label>Email</label>

        <input
          type="email"
          class="form-control"
          [(ngModel)]="usuario.email"
          name="email">

      </div>

      <button
        class="btn btn-success w-100"
        type="submit">

        Salvar

      </button>

    </form>

  </div>

</div>
