<div class="container mt-4">

  <h2 class="fw-bold text-success mb-4">
    Cadastrar Usuário
  </h2>

  <div class="card border-0 shadow-sm p-4">

    <form (ngSubmit)="salvar()">

      <div class="mb-3">
        <label>Nome</label>
        <input
          type="text"
          [(ngModel)]="usuario.nome"
          name="nome"
          class="form-control"
          required>
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="usuario.email"
          name="email"
          class="form-control"
          required>
      </div>

      <button
        class="btn btn-success w-100"
        type="submit">

        Salvar

      </button>

    </form>

  </div>

</div>
