<div class="container mt-4">

  <div class="topo">
  <button
  class="btn btn-outline-success me-3"
  (click)="voltar()">

  ←

</button>
 </div>
 
 <div class="header-biblioteca d-flex justify-content-between align-items-center mb-4">
    <h2>Usuários</h2>

    <button
  class="btn btn-success"
  routerLink="/usuarios/cadastro">
      Cadastrar Usuário
    </button>
  </div>

 <div class="usuarios-grid">
  <div class="usuario-card" *ngFor="let usuario of usuarios">

    <div class="usuario-topo">
      <div class="avatar">
        {{ usuario.nome.charAt(0).toUpperCase() }}
      </div>
    </div>

    <div class="usuario-info">
      <h5>{{ usuario.nome }}</h5>
      <p>{{ usuario.email }}</p>
    </div>

    <button
  class="btn btn-success w-100 mt-3"
      [routerLink]="['/usuarios/editar', usuario.id]">

      Editar
    </button>

  </div>
</div>

</div>
