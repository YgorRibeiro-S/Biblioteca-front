<div class="container-fluid">

  <div class="conteudo-full">

    <div class="header-biblioteca d-flex justify-content-between align-items-center mb-4">

      <h2>Sistema Biblioteca</h2>

      <div>

        <button class="btn btn-success me-2" routerLink="/cadastro">
          + Cadastrar Livro
        </button>

        <button class="btn btn-success me-2" routerLink="/usuarios">
          Usuários
        </button>

        <button class="btn btn-success me-2" routerLink="/livros/status">
          Gerenciar Status
        </button>

        <button class="btn btn-success me-2" routerLink="/estatisticas">
          Ver Estatísticas
        </button>

      </div>

    </div>

    <div
      class="row g-4 mb-4"
      *ngIf="mostrarEstatisticas && estatisticas">

      <div class="col-md-4">

        <div class="card shadow-sm border-0 h-100 text-center p-3">

          <h4>Total de Livros</h4>

          <p class="fs-3 fw-bold text-success">
            {{ estatisticas.totalLivros }}
          </p>

        </div>

      </div>

      <div class="col-md-4">

        <div class="card shadow-sm border-0 h-100 text-center p-3">

          <h4>Total de Exemplares</h4>

          <p class="fs-3 fw-bold text-success">
            {{ estatisticas.totalExemplares }}
          </p>

        </div>

      </div>

      <div class="col-md-4">

        <div class="card shadow-sm border-0 h-100 text-center p-3">

          <h4>Sem Estoque</h4>

          <p
            class="fs-3 fw-bold"
            [style.color]="estatisticas.livrosSemEstoque > 0 ? 'red' : 'green'">

            {{ estatisticas.livrosSemEstoque }}

          </p>

        </div>

      </div>

    </div>

    <div class="row g-4">

      <div
        class="col-md-4 col-lg-3"
        *ngFor="let livro of livros">

        <div class="card h-100 shadow-sm border-0">

          <img
            [src]="'http://localhost:8080/livros/' + livro.id + '/imagem'"
            class="card-img-top livro-img"
            alt="Capa do livro">

          <div class="card-body d-flex flex-column p-4">

            <h5 class="card-title mb-2">
              {{ livro.nome }}
            </h5>

            <p class="text-muted mb-2">
              {{ livro.autor }}
            </p>

            <p class="small mb-2">
              ISBN: {{ livro.isbn }}
            </p>

            <p class="fw-bold text-success mb-3">
              Qtd: {{ livro.quantidade }}
            </p>

            <div class="mt-auto">

              <button
                class="btn btn-success btn-sm me-2"
                (click)="emprestarLivro(livro.id)">

                Emprestar

              </button>

              <button
                class="btn btn-outline-success btn-sm"
                (click)="devolverLivro(livro.id)">

                Devolver

              </button>

            </div>

            <button
              class="btn btn-danger btn-sm mt-3"
              (click)="inativarLivro(livro.id)">

              Inativar

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
